# Netlify build and delivery settings. Owner: devops. Details: docs/operations.md
#
# IMPORTANT: runtime env vars for Functions are NOT set here.
# Variables declared in netlify.toml (including [context.*.environment]) apply to
# the BUILD only; they do not reach Functions at runtime (architecture.md section 5,
# Netlify docs "Environment variables for functions", checked by the architect on
# 2026-11-25; devops could not re-open the page, re-verify before launch).
# Set every name from .env.example in the Netlify UI (Site configuration ->
# Environment variables), with a separate value per deploy context (Production,
# Deploy Previews, Branch deploys). Changes only apply after the next deploy.
# Never put secret values in this file.

[build]
  command   = "npm run build && bash scripts/scan-dist.sh dist"
  publish   = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# No [[redirects]] on purpose: the front end is a multi-page Vite build
# (index.html, policies.html, privacy.html, admin/index.html) and each function
# serves itself at /api/* through its own config.path. Add redirects only if a
# page moves.

# Security headers for every static response.
# Note: headers here apply to static files; function responses set their own
# headers in netlify/lib/http.ts (no-store, noindex).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Hashed build assets never change, so cache them hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin pages: never cached, never indexed. (HSTS, CSP and the rest still come
# from the /* rule above; Netlify merges headers from every matching rule.)
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag  = "noindex, nofollow, noarchive"
